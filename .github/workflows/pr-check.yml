name: PR Check

on:
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9"

jobs:
  check:
    name: Lint, Tests & Build
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint API
        id: lint-api
        run: pnpm --filter @gestmoney/api lint
        continue-on-error: true

      - name: Lint Web
        id: lint-web
        run: pnpm --filter @gestmoney/web lint
        continue-on-error: true

      - name: Tests API
        id: test-api
        run: pnpm --filter @gestmoney/api test --passWithNoTests
        continue-on-error: true
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gestmoney_test
          JWT_SECRET: ci-test-secret-key-32chars-minimum
          JWT_REFRESH_SECRET: ci-test-refresh-secret-32chars

      - name: Build API
        id: build-api
        run: pnpm --filter @gestmoney/api build
        continue-on-error: true

      - name: Build Web
        id: build-web
        run: pnpm --filter @gestmoney/web build
        continue-on-error: true
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Commentaire PR avec résultat
        uses: actions/github-script@v7
        with:
          script: |
            const results = {
              'Lint API':   '${{ steps.lint-api.outcome }}',
              'Lint Web':   '${{ steps.lint-web.outcome }}',
              'Tests API':  '${{ steps.test-api.outcome }}',
              'Build API':  '${{ steps.build-api.outcome }}',
              'Build Web':  '${{ steps.build-web.outcome }}',
            };

            const icon = (r) => r === 'success' ? '✅' : r === 'failure' ? '❌' : '⚠️';

            const rows = Object.entries(results)
              .map(([name, r]) => `| ${icon(r)} ${name} | ${r} |`)
              .join('\n');

            const allPassed = Object.values(results).every(r => r === 'success');
            const summary = allPassed
              ? '**Tous les checks sont au vert — prêt pour merge.**'
              : '**Certains checks ont échoué — corriger avant de merger.**';

            const body = [
              '## Résultat des checks CI',
              '',
              summary,
              '',
              '| Check | Statut |',
              '|-------|--------|',
              rows,
              '',
              `> Commit: \`${{ github.sha }}\` — Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`,
            ].join('\n');

            // Chercher un commentaire existant du bot pour le mettre à jour
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Résultat des checks CI')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

            // Échouer le job si un check a échoué
            if (!allPassed) {
              core.setFailed('Un ou plusieurs checks ont échoué.');
            }
