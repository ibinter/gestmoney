name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch: # déclenchement manuel

env:
  VPS_HOST: 185.98.139.38
  VPS_USER: root
  PROJECT_DIR: /opt/gestmoney

jobs:
  # ─── 1. Tests et lint ────────────────────────────────────────────────
  test:
    name: Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint API
        run: pnpm --filter @gestmoney/api lint || true

      - name: Tests API
        run: pnpm --filter @gestmoney/api test --passWithNoTests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gestmoney_test
          JWT_SECRET: ci-test-secret-key-32chars-minimum
          JWT_REFRESH_SECRET: ci-test-refresh-secret-32chars

  # ─── 2. Build de vérification ────────────────────────────────────────
  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm --filter @gestmoney/api build

      - name: Build Web
        run: pnpm --filter @gestmoney/web build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}

  # ─── 3. Déploiement VPS ──────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-check
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ${{ env.PROJECT_DIR }}

            echo "=== Pull dernière version ==="
            git fetch origin main
            git reset --hard origin/main

            echo "=== Migrations Prisma ==="
            docker compose -f docker-compose.prod.yml exec -T api \
              npx prisma migrate deploy || \
              docker compose -f docker-compose.prod.yml run --rm api \
              npx prisma migrate deploy

            echo "=== Rebuild API ==="
            docker compose -f docker-compose.prod.yml up -d --build api

            echo "=== Rebuild Web ==="
            docker compose -f docker-compose.prod.yml up -d --build web

            echo "=== Nettoyage images inutilisées ==="
            docker image prune -f

            echo "=== Health check ==="
            sleep 15
            curl -f http://localhost:3001/health || echo "API health check échoué"
            curl -f http://localhost:3000 || echo "Web health check échoué"

            echo "=== Déploiement terminé ==="
